# Local development: backend on the host, MySQL in Docker (see docker-compose.yml)
spring.datasource.url=jdbc:mysql://localhost:3307/ironforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:ironforge}
spring.datasource.password=${DB_PASSWORD:ironforge123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dev-only fallback so `bootRun` works out of the box; override with a real JWT_SECRET env var for anything shared.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-change-me}
